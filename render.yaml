services:
  # Main API Service
  - type: web
    name: trucknet-ai   # Render service slug (URL: https://trucknet-ai.onrender.com)
    rootDir: apps/backend/api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://truck-net-ai-web.vercel.app
      - key: AI_ENGINE_URL
        fromService:
          name: trucknet-ai-engine
          type: web
          property: url
      - key: REDIS_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # AI Engine (Python FastAPI)
  - type: web
    name: trucknet-ai-engine
    rootDir: apps/ai_engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://truck-net-ai-web.vercel.app
      - key: HF_API_TOKEN
        sync: false

  # Frontend Service (Next.js)
  - type: web
    name: trucknet-web
    rootDir: apps/web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://trucknet-ai.onrender.com/api
        # Backend API is at trucknet-ai.onrender.com (Express, returns JSON 404 on /)
      - key: NEXT_PUBLIC_AI_ENGINE_URL
        value: https://trucknet-ai-engine.onrender.com
        # Render service name: trucknet-ai-engine
